<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 11 84 84"><style>
  .ms-logo{transform-origin:50px 52px;animation:ms-pop .62s cubic-bezier(.34,1.42,.5,1) both}
  .ms-check{stroke-dasharray:52.02;stroke-dashoffset:0;animation:ms-draw .58s .40s cubic-bezier(.62,.04,.2,1) both}
  @keyframes ms-pop{0%{opacity:0;transform:scale(.55)}55%{opacity:1}100%{opacity:1;transform:scale(1)}}
